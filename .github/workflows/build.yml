name: Build native VST3 plugin

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: NeditVST3-Linux
          - os: macos-latest
            artifact-name: NeditVST3-macOS
          - os: windows-latest
            artifact-name: NeditVST3-Windows

    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ~/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # Native rewrite: no JUCE. VSTGUI (the editor toolkit) is the only
      # component with system prerequisites and only on Linux -- X11 + XCB +
      # Wayland graphics backends, Cairo/Pango/Fontconfig text, GLib,
      # Freetype. macOS and Windows use VSTGUI's Cocoa / GDI backends and
      # need nothing extra. Everything else (VST3 SDK, VSTGUI sources,
      # Catch2, nlohmann) is fetched by CMake at configure time.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev wayland-protocols \
            libx11-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            ccache \
            libfreetype-dev

      - name: Install ccache
        if: runner.os == 'macOS'
        run: |
          command -v ccache >/dev/null 2>&1 || brew install ccache

      - name: Configure
        if: runner.os != 'macOS'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DNEDIT_BUILD_PLUGIN=ON
          -DNEDIT_BUILD_TOOLS=OFF
          -DNEDIT_BUILD_UI_HARNESS=OFF

      - name: Configure (macOS with ccache)
        if: runner.os == 'macOS'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          -DNEDIT_BUILD_PLUGIN=ON
          -DNEDIT_BUILD_TOOLS=OFF
          -DNEDIT_BUILD_UI_HARNESS=OFF

      - name: Build
        if: runner.os != 'macOS'
        run: cmake --build build --config Release --parallel

      - name: Build (macOS verbose)
        if: runner.os == 'macOS'
        run: |
          ccache --zero-stats || true
          cmake --build build --config Release --parallel --verbose

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Show ccache stats
        if: runner.os == 'macOS'
        run: ccache --show-stats || true

      - name: Upload VST3 bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/nedit.vst3
          if-no-files-found: error

  # Editor-open smoke test: open the plugin's editor on a real native parent
  # window from a minimal VST3 host. Must run in a DEBUG build -- VSTGUI
  # self-defines DEBUG and adds CView::dumpInfo() (a virtual), so only Debug
  # has the one-slot vtable the #25 crash (and its ODR-regressions) needs to
  # be caught. Release builds agree on both sides and would never crash.
  editor-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev wayland-protocols \
            libx11-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DNEDIT_BUILD_PLUGIN=ON -DNEDIT_BUILD_TOOLS=OFF

      - name: Build bundle + smoke tool
        run: cmake --build build --config Debug --parallel --target nedit_vst3 nedit_editor_smoke

      - name: Run editor smoke test
        shell: bash
        run: |
          # Two instances: the second editor open() is exactly the multi-
          # instance scenario that used to clobber the shared X11 runloop
          # (second-instance engine crash); opening both then pumping both
          # drives every editor's idle timers + fd handlers through the one
          # shared runloop and fails if that routing is corrupted.
          # Five reopen cycles: repeatedly close/reopen each editor drives
          # RunLoop::exit/init (xcb reconnect); pre-fix VSTGUI walked stale
          # screen data in cairo_xcb_surface_create and crashed (the #334
          # open/close/open crash regression we patch out).
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./build/tools/nedit_editor_smoke ./build/nedit.vst3 300 2 5
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ./build/tools/Debug/nedit_editor_smoke.exe ./build/nedit.vst3 300 2 5
          else
            ./build/tools/nedit_editor_smoke ./build/nedit.vst3 300 2 5
          fi

  # UI-test harness (issue #2 scroll/pan): opens the editor IN-PROCESS and
  # drives synthetic mouse/wheel events straight into the live CFrame via the
  # Debug-only test hooks, asserting the persisted sequencer viewport reacts
  # correctly (zoom/pan/scrollbars). Must be a DEBUG build -- the test hooks
  # (and VSTGUI's DEBUG vtable) only exist there. Linux-only for now: the
  # direct-injection driver is portable, but the in-process VSTGUI::init path
  # (no bundle load) is currently only verified on Linux/xcb; macOS/Windows
  # are a follow-up. Runs under xvfb (headless -> the harness would exit 77).
  ui-harness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev wayland-protocols \
            libx11-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            libfreetype-dev \
            xvfb

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DNEDIT_BUILD_PLUGIN=ON -DNEDIT_BUILD_TOOLS=OFF -DNEDIT_BUILD_UI_HARNESS=ON

      - name: Build UI harness
        run: cmake --build build --config Debug --parallel --target nedit_ui_harness

      - name: Run UI harness
        shell: bash
        run: xvfb-run -a ./build/tools/nedit_ui_harness all
