name: Build native VST3 plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: NeditVST3-Linux
          - os: macos-latest
            artifact-name: NeditVST3-macOS
          - os: windows-latest
            artifact-name: NeditVST3-Windows

    runs-on: ${{ matrix.os }}
    env:
      CCACHE_DIR: ~/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      # Native rewrite: no JUCE. VSTGUI (the editor toolkit) is the only
      # component with system prerequisites and only on Linux -- X11 + XCB +
      # Wayland graphics backends, Cairo/Pango/Fontconfig text, GLib,
      # Freetype. macOS and Windows use VSTGUI's Cocoa / GDI backends and
      # need nothing extra. Everything else (VST3 SDK, VSTGUI sources,
      # Catch2, nlohmann) is fetched by CMake at configure time.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev wayland-protocols \
            libx11-dev \
            libxcb1-dev libxcb-util-dev libxcb-cursor-dev \
            libxcb-keysyms1-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libfontconfig1-dev \
            ccache \
            libfreetype-dev

      - name: Install ccache
        if: runner.os == 'macOS'
        run: |
          command -v ccache >/dev/null 2>&1 || brew install ccache

      - name: Configure
        if: runner.os != 'macOS'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DNEDIT_BUILD_PLUGIN=ON
          -DNEDIT_BUILD_TOOLS=OFF

      - name: Configure (macOS with ccache)
        if: runner.os == 'macOS'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache
          -DNEDIT_BUILD_PLUGIN=ON
          -DNEDIT_BUILD_TOOLS=OFF

      - name: Build
        if: runner.os != 'macOS'
        run: cmake --build build --config Release --parallel

      - name: Build (macOS verbose)
        if: runner.os == 'macOS'
        run: |
          ccache --zero-stats || true
          cmake --build build --config Release --parallel --verbose

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Show ccache stats
        if: runner.os == 'macOS'
        run: ccache --show-stats || true

      - name: Upload VST3 bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: build/nedit.vst3
          if-no-files-found: error