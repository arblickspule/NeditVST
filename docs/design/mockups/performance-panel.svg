<svg xmlns="http://www.w3.org/2000/svg" width="912" height="268" viewBox="0 0 912 268" font-family="Inter, Roboto, system-ui, sans-serif">
  <style>
    .pri{fill:#E8EAED}.sec{fill:#9AA0A6}.dis{fill:#5F6368}.sal{fill:#FA8072}
    .sal3{fill:#FF9A8C}.onsal{fill:#20100D}.hair{stroke:#33383F;stroke-width:1}
    .track{fill:#33383F}.chip{fill:#22262C;stroke:#33383F}
    .mono{font-family:'JetBrains Mono','Roboto Mono',ui-monospace,monospace}
    .cap9{font-size:9.5px}
  </style>
  <rect width="912" height="268" fill="#14161A"/>

  <!-- TAB BAR (active: PERFORMANCE) -->
  <g font-size="11" letter-spacing="1.5" text-anchor="middle" font-weight="500">
    <text x="114" y="20" class="sec">GENERATE</text>
    <text x="342" y="20" class="sec">SEQUENCER</text>
    <text x="570" y="20" class="sal">PERFORMANCE</text>
    <text x="798" y="20" class="sec">CONTROL</text>
  </g>
  <rect x="456" y="28" width="228" height="2" rx="1" class="sal"/>

  <!-- PANEL y=40..268 -->
  <!-- Bank slots grid (4&#215;4) -->
  <rect x="0" y="40" width="400" height="228" rx="6" fill="#1B1E23"/>
  <text x="12" y="58" class="sec" font-size="10.5" letter-spacing="1.5" font-weight="500">BANK SLOTS</text>
  <g opacity="0.5">
    <!-- Row 1 -->
    <rect x="12" y="68" width="92" height="48" rx="4" fill="#3B2622" stroke="#FA8072" stroke-width="1"/>
    <text x="22" y="84" class="sal" font-size="9" font-weight="600">01</text>
    <text x="22" y="98" class="pri cap9">FWD</text>
    <text x="62" y="98" class="sec" font-size="8">SLICE LEN</text>

    <rect x="112" y="68" width="92" height="48" rx="4" class="chip"/>
    <text x="122" y="84" class="sec" font-size="9">02</text>
    <text x="122" y="98" class="sec cap9">PPG</text>
    <text x="162" y="98" class="dis" font-size="8">SLICE LEN</text>

    <rect x="212" y="68" width="92" height="48" rx="4" class="chip"/>
    <text x="222" y="84" class="sec" font-size="9">03</text>
    <text x="222" y="98" class="sec cap9">TAP</text>
    <text x="262" y="98" class="dis" font-size="8">CLOCK</text>

    <rect x="312" y="68" width="92" height="48" rx="4" class="chip"/>
    <text x="322" y="84" class="sec" font-size="9">04</text>
    <text x="322" y="98" class="dis cap9">EMPTY</text>

    <!-- Row 2 -->
    <rect x="12" y="124" width="92" height="48" rx="4" class="chip"/>
    <text x="22" y="140" class="sec" font-size="9">05</text>
    <text x="22" y="154" class="sec cap9">STR</text>
    <text x="62" y="154" class="dis" font-size="8">SEQ</text>

    <rect x="112" y="124" width="92" height="48" rx="4" class="chip"/>
    <text x="122" y="140" class="sec" font-size="9">06</text>
    <text x="122" y="154" class="sec cap9">FDWN</text>
    <text x="162" y="154" class="dis" font-size="8">SEQ</text>

    <rect x="212" y="124" width="92" height="48" rx="4" class="chip"/>
    <text x="222" y="140" class="sec" font-size="9">07</text>
    <text x="222" y="154" class="dis cap9">EMPTY</text>

    <rect x="312" y="124" width="92" height="48" rx="4" class="chip"/>
    <text x="322" y="140" class="sec" font-size="9">08</text>
    <text x="322" y="154" class="dis cap9">EMPTY</text>

    <!-- Row 3 -->
    <rect x="12" y="180" width="92" height="48" rx="4" class="chip"/>
    <text x="22" y="196" class="sec" font-size="9">09</text>
    <text x="22" y="210" class="dis cap9">EMPTY</text>
    <rect x="112" y="180" width="92" height="48" rx="4" class="chip"/>
    <text x="122" y="196" class="sec" font-size="9">10</text>
    <text x="122" y="210" class="dis cap9">EMPTY</text>
    <rect x="212" y="180" width="92" height="48" rx="4" class="chip"/>
    <text x="222" y="196" class="sec" font-size="9">11</text>
    <text x="222" y="210" class="dis cap9">EMPTY</text>
    <rect x="312" y="180" width="92" height="48" rx="4" class="chip"/>
    <text x="322" y="196" class="sec" font-size="9">12</text>
    <text x="322" y="210" class="dis cap9">EMPTY</text>

    <!-- Row 4 (pagination hint) -->
    <text x="160" y="248" text-anchor="middle" class="dis" font-size="8">1 / 8 pages &#8226; 128 slots</text>
  </g>

  <!-- Recall + controls card -->
  <rect x="408" y="40" width="504" height="228" rx="6" fill="#1B1E23"/>
  <text x="420" y="58" class="sec" font-size="10.5" letter-spacing="1.5" font-weight="500">PERFORMANCE CONTROLS</text>
  <g opacity="0.5">
    <!-- Focused slot detail -->
    <text x="420" y="86" class="sec cap9">FOCUSED SLOT</text>
    <rect x="520" y="74" width="120" height="18" rx="4" fill="#3B2622" stroke="#FA8072" stroke-width="1"/>
    <text x="530" y="88" class="sal" font-size="10" font-weight="600">01</text>
    <text x="556" y="88" class="pri cap9">FWD</text>

    <text x="420" y="118" class="sec cap9">QUANTIZE RECALL</text>
    <rect x="540" y="108" width="56" height="16" rx="2" class="chip"/>
    <text x="550" y="120" class="pri cap9">ON</text>
    <text x="608" y="120" class="sec cap9">INTERVAL</text>
    <rect x="672" y="108" width="64" height="16" rx="2" class="chip"/>
    <text x="682" y="120" class="pri cap9">1/4</text>
    <path d="M720,114 l4,5 l4,-5 z" class="sec"/>

    <text x="420" y="150" class="sec cap9">LOOP</text>
    <rect x="540" y="140" width="56" height="16" rx="2" class="chip"/>
    <text x="550" y="152" class="pri cap9">ON</text>

    <text x="420" y="182" class="sec cap9">SYNC</text>
    <rect x="540" y="172" width="56" height="16" rx="2" class="chip"/>
    <text x="550" y="184" class="pri cap9">ON</text>

    <!-- Snapshot mini-preview -->
    <text x="420" y="214" class="sec cap9">SLOT SNAPSHOT</text>
    <rect x="420" y="222" width="480" height="36" rx="4" fill="#22262C" stroke="#33383F"/>
    <g opacity="0.4">
      <rect x="432" y="232" width="50" height="4" rx="2" class="track"/>
      <rect x="432" y="232" width="30" height="4" rx="2" class="sal"/>
      <rect x="500" y="232" width="50" height="4" rx="2" class="track"/>
      <rect x="500" y="232" width="20" height="4" rx="2" class="sal"/>
      <rect x="568" y="232" width="50" height="4" rx="2" class="track"/>
      <rect x="568" y="232" width="42" height="4" rx="2" class="sal"/>
      <rect x="636" y="232" width="50" height="4" rx="2" class="track"/>
      <rect x="636" y="232" width="14" height="4" rx="2" class="sal"/>
      <rect x="704" y="232" width="50" height="4" rx="2" class="track"/>
      <rect x="704" y="232" width="38" height="4" rx="2" class="sal"/>
      <rect x="772" y="232" width="50" height="4" rx="2" class="track"/>
      <rect x="772" y="232" width="56" height="4" rx="2" class="sal"/>
      <rect x="840" y="232" width="50" height="4" rx="2" class="track"/>
      <rect x="840" y="232" width="8" height="4" rx="2" class="sal"/>
    </g>
    <text x="432" y="252" class="dis" font-size="7.5">frozen snapshot of style params at recall time</text>
  </g>
</svg>